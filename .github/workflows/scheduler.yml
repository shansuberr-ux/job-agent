name: Shan Job Scout Agent

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      custom_query:
        description: 'Custom search query from Telegram'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scout-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Agent
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_QUERY: ${{ github.event.inputs.custom_query }}
        run: python main.py

      - name: Save Seen Jobs State
        run: |
          git config --global user.name 'JobScoutBot'
          git config --global user.email 'bot@noreply.github.com'
          git add seen_jobs.json || true
          git diff --staged --quiet || (git commit -m "Update seen jobs state" && git pull --rebase origin main && git push)
