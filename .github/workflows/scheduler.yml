name: Shan Job Scout Agent

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch:      # Lets you trigger a test run manually with 1 click

permissions:
  contents: write

jobs:
  scout-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save Seen Jobs State
        run: |
          git config --global user.name 'JobScoutBot'
          git config --global user.email 'bot@noreply.github.com'
          git add seen_jobs.json || true
          git diff --staged --quiet || (git commit -m "Update seen jobs" && git pull --rebase origin main && git push)

      - name: Save Seen Jobs State
        run: |
          git config --global user.name 'JobScoutBot'
          git config --global user.email 'bot@noreply.github.com'
          git add seen_jobs.json || true
          git diff --staged --quiet || git commit -m "Update seen jobs"
          git push
